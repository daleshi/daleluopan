<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#f5a623"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
    <linearGradient id="trend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#53d8fb"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#ring)" stroke-width="2.5"/>
  <!-- Compass ring marks -->
  <g stroke="#e94560" stroke-width="1.5" opacity="0.7">
    <line x1="32" y1="6" x2="32" y2="11"/>
    <line x1="32" y1="53" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="11" y2="32"/>
    <line x1="53" y1="32" x2="58" y2="32"/>
  </g>
  <!-- Smaller tick marks -->
  <g stroke="#f5a623" stroke-width="1" opacity="0.4">
    <line x1="13.4" y1="13.4" x2="16.9" y2="16.9"/>
    <line x1="50.6" y1="13.4" x2="47.1" y2="16.9"/>
    <line x1="13.4" y1="50.6" x2="16.9" y2="47.1"/>
    <line x1="50.6" y1="50.6" x2="47.1" y2="47.1"/>
  </g>
  <!-- Inner circle -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#e94560" stroke-width="0.5" opacity="0.3"/>
  <!-- Trend line (rising market) -->
  <polyline points="14,42 22,38 28,40 34,33 40,30 46,24 50,20" fill="none" stroke="url(#trend)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend glow -->
  <polyline points="14,42 22,38 28,40 34,33 40,30 46,24 50,20" fill="none" stroke="#53d8fb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <!-- Compass needle (pointing up-right, symbolizing growth) -->
  <g transform="translate(32,32) rotate(-45)">
    <polygon points="0,-18 3,0 0,-2 -3,0" fill="url(#needle)" opacity="0.9"/>
    <polygon points="0,12 2,0 0,2 -2,0" fill="#4a4a6a" opacity="0.6"/>
  </g>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#e94560"/>
  <circle cx="32" cy="32" r="1.5" fill="#f5a623"/>
  <!-- "乐" character hint - small decorative element -->
  <text x="32" y="48" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#f5a623" opacity="0.8">乐</text>
</svg>
